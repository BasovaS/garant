<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Гарант — каталог анализов</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand-row">
        <div class="brand">
          <div class="brand-mark">Г</div>
          <div><strong>Гарант</strong><small>Каталог лабораторных исследований</small></div>
        </div>
        <div class="offline-badge">Данные из analyses.xlsx</div>
      </div>
      <nav class="tabs" aria-label="Разделы">
        <button class="tab active" data-tab="invitro">Инвитро</button>
        <button class="tab" data-tab="hemotest">Гемотест</button>
        <button class="tab" data-tab="checkups">Чекапы</button>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section id="catalogView" class="catalog-view">
      <div class="catalog-layout">
        <aside class="panel result-panel">
          <div class="panel-head">
            <h1 class="panel-title">Итог</h1>
            <span id="selectedCount" class="count-pill">0</span>
          </div>
          <pre id="resultText" class="result-box result-placeholder">Загружаю данные…</pre>
          <div class="action-grid">
            <button id="generateBtn" class="btn primary">Создать ГП</button>
            <button id="copyBtn" class="btn">Скопировать</button>
            <button id="resetBtn" class="btn danger">Сбросить</button>
          </div>
        </aside>

        <section class="panel table-panel">
          <div class="toolbar">
            <div class="search-wrap">
              <input id="searchInput" class="search" type="search" autocomplete="off" placeholder="Поиск по коду, названию или биоматериалу…" aria-label="Поиск по таблице">
              <button id="clearSearch" class="clear-search" aria-label="Очистить поиск" title="Очистить поиск">×</button>
            </div>
            <div class="toolbar-actions">
              <button id="selectPageBtn" class="btn">Выбрать страницу</button>
              <button id="clearSelectionBtn" class="btn">Очистить выбор</button>
            </div>
          </div>
          <div class="table-meta">
            <span id="tableTitle">Инвитро</span>
            <span id="tableStats"></span>
          </div>
          <div class="table-scroll">
            <table>
              <thead id="tableHead"></thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>
          <div class="pagination">
            <button id="prevPage" class="btn" aria-label="Предыдущая страница">←</button>
            <span id="pageLabel" class="page-label"></span>
            <button id="nextPage" class="btn" aria-label="Следующая страница">→</button>
          </div>
        </section>
      </div>
    </section>

    <section id="checkupsView" class="checkups-view">
      <div class="checkups-head">
        <div>
          <h1>Чекапы</h1>
          <p>Состав программ и готовые формулировки для копирования</p>
        </div>
        <div class="search-wrap checkup-search">
          <input id="checkupSearch" class="search" type="search" autocomplete="off" placeholder="Поиск по чекапам…" aria-label="Поиск по чекапам">
        </div>
      </div>
      <div id="checkupGrid" class="checkup-grid"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">Скопировано</div>
  <script src="app.js?v=20261003-2"></script>
</body>
</html>
