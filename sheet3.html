<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Гемотест — Гарант</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="main.js" defer></script>

  <main class="shell">
    <div class="catalog-layout">
      <aside class="panel result-panel">
        <div class="panel-head">
          <h1 class="panel-title">Итог</h1>
          <span id="selectedCount" class="count-pill">0</span>
        </div>
        <pre id="resultText" class="result-box result-placeholder">Выберите анализы в таблице и нажмите «Создать ГП».</pre>
        <div class="action-grid">
          <button id="generateBtn" class="btn primary">Создать ГП</button>
          <button id="copyBtn" class="btn">Скопировать</button>
          <button id="resetBtn" class="btn danger">Сбросить</button>
        </div>
      </aside>

      <section class="panel table-panel">
        <div class="toolbar">
          <div class="search-wrap">
            <input id="searchInput" class="search" type="search" autocomplete="off" placeholder="Поиск по коду или названию…" aria-label="Поиск по таблице">
            <button id="clearSearch" class="clear-search" aria-label="Очистить поиск" title="Очистить поиск">×</button>
          </div>
          <div class="toolbar-actions">
            <button id="selectPageBtn" class="btn">Выбрать страницу</button>
            <button id="clearSelectionBtn" class="btn">Очистить выбор</button>
          </div>
        </div>
        <div class="table-meta">
          <span>Гемотест</span>
          <span id="tableStats"></span>
        </div>
        <div class="table-scroll">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div class="pagination">
          <button id="prevPage" class="btn" aria-label="Предыдущая страница">←</button>
          <span id="pageLabel" class="page-label"></span>
          <button id="nextPage" class="btn" aria-label="Следующая страница">→</button>
        </div>
      </section>
    </div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">Скопировано</div>

  <script>
    const PAGE_SIZE = 100;
    const state = { rows: [], page: 1, query: '', selected: new Set(), result: '' };

    const els = {
      search: document.getElementById('searchInput'),
      clearSearch: document.getElementById('clearSearch'),
      head: document.getElementById('tableHead'),
      body: document.getElementById('tableBody'),
      stats: document.getElementById('tableStats'),
      selectedCount: document.getElementById('selectedCount'),
      result: document.getElementById('resultText'),
      pageLabel: document.getElementById('pageLabel'),
      prev: document.getElementById('prevPage'),
      next: document.getElementById('nextPage'),
      selectPage: document.getElementById('selectPageBtn'),
      clearSelection: document.getElementById('clearSelectionBtn'),
      toast: document.getElementById('toast')
    };

    const normalize = value => String(value ?? '').toLocaleLowerCase('ru-RU').replace(/ё/g, 'е').trim();

    function sheetToRows(sheet) {
      const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      const headers = matrix[0] || [];
      return matrix.slice(1)
        .filter(row => row.some(value => String(value).trim() !== ''))
        .map((values, index) => ({
          id: index + 1,
          values,
          code: values[1] ?? '',
          name: values[2] ?? '',
          headers
        }));
    }

    async function loadExcel() {
      const response = await fetch('analyses.xlsx');
      if (!response.ok) throw new Error('Не удалось загрузить analyses.xlsx');
      const arrayBuffer = await response.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      state.rows = sheetToRows(workbook.Sheets[workbook.SheetNames[2]]);
      render();
    }

    function filteredRows() {
      const tokens = normalize(state.query).split(/\s+/).filter(Boolean);
      if (!tokens.length) return state.rows;
      return state.rows.filter(row => {
        const haystack = normalize(row.values.join(' '));
        return tokens.every(token => haystack.includes(token));
      });
    }

    function visibleRows() {
      const rows = filteredRows();
      const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
      state.page = Math.min(state.page, totalPages);
      const start = (state.page - 1) * PAGE_SIZE;
      return { rows, pageRows: rows.slice(start, start + PAGE_SIZE), totalPages };
    }

    function render() {
      const { rows, pageRows, totalPages } = visibleRows();
      els.stats.textContent = `Найдено: ${rows.length.toLocaleString('ru-RU')} · Всего: ${state.rows.length.toLocaleString('ru-RU')}`;
      els.selectedCount.textContent = state.selected.size;
      els.pageLabel.textContent = `Страница ${state.page} из ${totalPages}`;
      els.prev.disabled = state.page <= 1;
      els.next.disabled = state.page >= totalPages;
      els.search.value = state.query;

      els.head.replaceChildren();
      const hr = document.createElement('tr');
      const ch = document.createElement('th');
      ch.className = 'check-cell';
      ch.textContent = '✓';
      hr.append(ch);
      const headers = state.rows[0]?.headers || [];
      headers.slice(1).forEach(label => {
        const th = document.createElement('th');
        th.textContent = label || '—';
        hr.append(th);
      });
      els.head.append(hr);

      const fragment = document.createDocumentFragment();
      pageRows.forEach(row => {
        const tr = document.createElement('tr');
        if (state.selected.has(row.id)) tr.classList.add('selected');

        const ctd = document.createElement('td');
        ctd.className = 'check-cell';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'row-check';
        cb.checked = state.selected.has(row.id);
        cb.addEventListener('change', () => {
          if (cb.checked) state.selected.add(row.id);
          else state.selected.delete(row.id);
          tr.classList.toggle('selected', cb.checked);
          els.selectedCount.textContent = state.selected.size;
        });
        ctd.append(cb);
        tr.append(ctd);

        row.values.slice(1).forEach(value => {
          const td = document.createElement('td');
          td.textContent = value === '' || value == null ? '—' : String(value);
          tr.append(td);
        });
        fragment.append(tr);
      });

      if (!pageRows.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.className = 'empty';
        td.colSpan = Math.max(2, state.rows[0]?.values.length || 1);
        td.textContent = 'Ничего не найдено. Попробуйте изменить запрос.';
        tr.append(td);
        fragment.append(tr);
      }
      els.body.replaceChildren(fragment);

      els.result.textContent = state.result || 'Выберите анализы в таблице и нажмите «Создать ГП».';
      els.result.classList.toggle('result-placeholder', !state.result);
    }

    function generateResult() {
      const rows = state.rows.filter(row => state.selected.has(row.id));
      if (!rows.length) {
        state.result = 'Не выбраны анализы.';
      } else {
        state.result = 'ID 10524 ООО «Бестдоктор»\n'
          + rows.map(row => `${row.code} - ${row.name} - 1 шт.`).join('\n')
          + '\nАдрес: ';
      }
      els.result.textContent = state.result;
      els.result.classList.remove('result-placeholder');
    }

    async function copyText(text) {
      if (!text) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.append(area);
          area.select();
          const ok = document.execCommand('copy');
          area.remove();
          if (!ok) throw new Error('copy failed');
        }
        showToast('Скопировано');
      } catch {
        showToast('Не удалось скопировать');
      }
    }

    let toastTimer;
    function showToast(message) {
      clearTimeout(toastTimer);
      els.toast.textContent = message;
      els.toast.classList.add('show');
      toastTimer = setTimeout(() => els.toast.classList.remove('show'), 1800);
    }

    function clearSelection() {
      state.selected.clear();
      state.result = '';
      render();
    }

    els.search.addEventListener('input', () => {
      state.query = els.search.value;
      state.page = 1;
      render();
    });
    els.clearSearch.addEventListener('click', () => {
      state.query = '';
      state.page = 1;
      render();
      els.search.focus();
    });
    els.prev.addEventListener('click', () => { state.page--; render(); });
    els.next.addEventListener('click', () => { state.page++; render(); });
    els.selectPage.addEventListener('click', () => {
      visibleRows().pageRows.forEach(row => state.selected.add(row.id));
      render();
    });
    els.clearSelection.addEventListener('click', clearSelection);
    document.getElementById('generateBtn').addEventListener('click', generateResult);
    document.getElementById('resetBtn').addEventListener('click', clearSelection);
    document.getElementById('copyBtn').addEventListener('click', () => {
      if (state.result) copyText(state.result);
      else showToast('Сначала создайте ГП');
    });

    loadExcel().catch(error => {
      console.error(error);
      els.body.innerHTML = '<tr><td class="empty">Не удалось загрузить данные.</td></tr>';
    });
  </script>
</body>
</html>
