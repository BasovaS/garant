<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Чекапы — Гарант</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
  <div id="header-placeholder"></div>
  <script src="main.js" defer></script>

  <main class="checkups-shell">
    <div class="checkups-head">
      <div>
        <h1>Чекапы</h1>
        <p>Состав программ и готовые формулировки для копирования</p>
      </div>
      <div class="search-wrap checkup-search">
        <input id="checkupSearch" class="search" type="search" autocomplete="off" placeholder="Поиск по чекапам…" aria-label="Поиск по чекапам">
      </div>
    </div>
    <div id="checkupGrid" class="checkup-grid"></div>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite">Скопировано</div>

  <script>
    let rows = [];
    const grid = document.getElementById('checkupGrid');
    const search = document.getElementById('checkupSearch');
    const toast = document.getElementById('toast');

    const normalize = value => String(value ?? '').toLocaleLowerCase('ru-RU').replace(/ё/g, 'е').trim();

    async function loadExcel() {
      const response = await fetch('analyses.xlsx');
      if (!response.ok) throw new Error('Не удалось загрузить analyses.xlsx');
      const arrayBuffer = await response.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, { type: 'array' });
      const sheet = workbook.Sheets[workbook.SheetNames[3]];
      const matrix = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });

      rows = matrix.slice(1)
        .filter(row => row.some(value => String(value).trim() !== ''))
        .map((values, index) => ({
          id: index + 1,
          name: values[0] ?? '',
          composition: values[1] ?? '',
          standard: values[2] ?? '',
          invitro: values[3] ?? ''
        }));

      render();
    }

    function createCopyBlock(title, text) {
      const block = document.createElement('section');
      block.className = 'copy-block';

      const heading = document.createElement('h3');
      heading.textContent = title;

      const pre = document.createElement('pre');
      pre.textContent = text || '—';

      const button = document.createElement('button');
      button.className = 'copy-cell';
      button.type = 'button';
      button.textContent = '⧉';
      button.title = `Скопировать: ${title}`;
      button.setAttribute('aria-label', `Скопировать ${title}`);
      button.addEventListener('click', () => copyText(text));

      block.append(heading, button, pre);
      return block;
    }

    function render() {
      const tokens = normalize(search.value).split(/\s+/).filter(Boolean);
      const filtered = rows.filter(row => {
        if (!tokens.length) return true;
        const haystack = normalize(Object.values(row).join(' '));
        return tokens.every(token => haystack.includes(token));
      });

      const fragment = document.createDocumentFragment();
      filtered.forEach(row => {
        const card = document.createElement('article');
        card.className = 'panel checkup-card';

        const title = document.createElement('h2');
        title.className = 'checkup-name';
        title.textContent = row.name || 'Без названия';

        const columns = document.createElement('div');
        columns.className = 'checkup-columns';
        columns.append(
          createCopyBlock('Состав', row.composition),
          createCopyBlock('Стандартное ГП', row.standard),
          createCopyBlock('Код Инвитро', row.invitro)
        );

        card.append(title, columns);
        fragment.append(card);
      });

      if (!filtered.length) {
        const empty = document.createElement('div');
        empty.className = 'panel empty';
        empty.textContent = 'Чекапы по запросу не найдены.';
        fragment.append(empty);
      }

      grid.replaceChildren(fragment);
    }

    async function copyText(text) {
      if (!text) return;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const area = document.createElement('textarea');
          area.value = text;
          area.setAttribute('readonly', '');
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.append(area);
          area.select();
          const ok = document.execCommand('copy');
          area.remove();
          if (!ok) throw new Error('copy failed');
        }
        showToast('Скопировано');
      } catch {
        showToast('Не удалось скопировать');
      }
    }

    let timer;
    function showToast(message) {
      clearTimeout(timer);
      toast.textContent = message;
      toast.classList.add('show');
      timer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    search.addEventListener('input', render);

    loadExcel().catch(error => {
      console.error(error);
      grid.innerHTML = '<div class="panel empty">Не удалось загрузить данные.</div>';
    });
  </script>
</body>
</html>
